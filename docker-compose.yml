version: '3.8'

services:
  backend:
    build: ./backend  # Path to backend Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}  # Use environment variables from .env file
      - APP_ENV=production
    networks:
      - app-network

  frontend:
    build: ./frontend  # Path to frontend Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

# Define a network for the services to communicate
networks:
  app-network:
    driver: bridge

# Optional: Use an external .env file for secrets
# (Create a `.env` file in the same folder as docker-compose.yml)
